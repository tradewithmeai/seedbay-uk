name: Deploy to Krystal

on:
  push:
    branches: [ "main" ]
  # Listing pages are pre-rendered at build time (static export — there is no
  # request-time fetch on Krystal), so a listing posted today is only crawlable
  # after the next build. This nightly run is what keeps the sitemap current.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First deploy only: build with no listings because the API is not on the server yet'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          # The build reads the live API to pre-render listing pages. The API is
          # public and read-only for this, so there is no credential here.
          SEEDBAY_API_BASE: https://seedbay.co.uk
          # One cache key per run, shared by every build worker: fresh listings
          # each build, fetched once within it. See src/lib/seeds-static.ts.
          SEEDBAY_BUILD_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          # Only ever set by a manual run with the bootstrap box ticked.
          SEEDBAY_BOOTSTRAP: ${{ inputs.bootstrap && '1' || '0' }}

      - name: Write deploy marker
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > out/deploy-marker.txt

      - name: Deploy to Krystal via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.KRYSTAL_HOST }}
          username: ${{ secrets.KRYSTAL_USER }}
          password: ${{ secrets.KRYSTAL_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          log-level: verbose
